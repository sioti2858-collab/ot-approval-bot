name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q bot services models config.py main.py monitor.py

      - name: Import check
        run: python -c "import config, bot.handlers, services.pdf, services.sheets, services.delivery; print('import ok')"

      - name: Run tests
        run: |
          python tools/test_guides.py
          python tools/test_idempotency.py
          python tools/test_overday_flow.py
          python tools/test_flow.py
